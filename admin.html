<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zamran Web Development - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  width:95%;
  max-width:1200px;
  margin:auto;
}

header{
  background:#111827;
  color:white;
  padding:18px 0;
  margin-bottom:25px;
}

header .container{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{font-size:22px}

button{
  border:0;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.logout{
  background:#ef4444;
  color:white;
}

.login-box{
  max-width:400px;
  margin:70px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.login-btn{
  width:100%;
  background:#2563eb;
  color:white;
}

#loginError{
  color:#dc2626;
  text-align:center;
  margin-top:12px;
}

#dashboard{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.stat h3{
  font-size:14px;
  color:#6b7280;
  margin-bottom:8px;
}

.stat p{
  font-size:28px;
  font-weight:bold;
}

.orders{
  background:white;
  border-radius:12px;
  padding:20px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f8fafc;
}

select{
  padding:8px;
  border:1px solid #ddd;
  border-radius:7px;
}

.delete{
  background:#dc2626;
  color:white;
}

.details{
  max-width:250px;
  word-break:break-word;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  header .container{
    flex-direction:column;
    gap:12px;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">

<h2>🔐 Admin Login</h2>

<input
id="email"
type="email"
placeholder="Admin Email">

<input
id="password"
type="password"
placeholder="Password">

<button class="login-btn" onclick="login()">
Login
</button>

<div id="loginError"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

<header>
<div class="container">

<h1>🚀 Zamran Web Development</h1>

<button class="logout" onclick="logout()">
Logout
</button>

</div>
</header>


<main class="container">

<div class="stats">

<div class="stat">
<h3>Total Orders</h3>
<p id="totalOrders">0</p>
</div>

<div class="stat">
<h3>New Orders</h3>
<p id="newOrders">0</p>
</div>

<div class="stat">
<h3>In Progress</h3>
<p id="progressOrders">0</p>
</div>

<div class="stat">
<h3>Completed</h3>
<p id="completedOrders">0</p>
</div>

</div>


<div class="orders">

<h2 style="margin-bottom:20px">
📋 Client Orders
</h2>

<div id="ordersContent">
Loading orders...
</div>

</div>

</main>

</div>


<script>

/* =================================
   SUPABASE CONNECTION
================================= */

const SUPABASE_URL =
"https://oqfzfprimebfswosmwou.supabase.co";

const SUPABASE_KEY =
"YOUR_PUBLISHABLE_KEY";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================
   LOGIN
================================= */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const errorBox =
document.getElementById("loginError");

errorBox.textContent="";

if(!email || !password){

errorBox.textContent=
"Please enter email and password.";

return;
}

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

errorBox.textContent=error.message;

return;
}

showDashboard();

}


/* =================================
   LOGOUT
================================= */

async function logout(){

await supabaseClient.auth.signOut();

document.getElementById("dashboard")
.style.display="none";

document.getElementById("loginBox")
.style.display="block";

}


/* =================================
   DASHBOARD
================================= */

async function showDashboard(){

document.getElementById("loginBox")
.style.display="none";

document.getElementById("dashboard")
.style.display="block";

await loadOrders();

}


/* =================================
   SESSION
================================= */

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){

showDashboard();

}

}


/* =================================
   LOAD ORDERS
================================= */

async function loadOrders(){

const {data,error} =
await supabaseClient
.from("client_orders")
.select("*")
.order("created_at",{ascending:false});


if(error){

document.getElementById("ordersContent")
.innerHTML=
"<p style='color:red'>Error: "
+escapeHtml(error.message)
+"</p>";

return;
}

updateStats(data);

displayOrders(data);

}


/* =================================
   STATS
================================= */

function updateStats(orders){

document.getElementById("totalOrders")
.textContent=orders.length;

document.getElementById("newOrders")
.textContent=
orders.filter(o=>o.status==="New").length;

document.getElementById("progressOrders")
.textContent=
orders.filter(o=>o.status==="In Progress").length;

document.getElementById("completedOrders")
.textContent=
orders.filter(o=>o.status==="Completed").length;

}


/* =================================
   DISPLAY ORDERS
================================= */

function displayOrders(orders){

const box=
document.getElementById("ordersContent");

if(!orders.length){

box.innerHTML=
"<div class='empty'>No client orders yet.</div>";

return;
}

let html=`

<table>

<thead>

<tr>
<th>Date</th>
<th>Company</th>
<th>Country</th>
<th>Business</th>
<th>Service</th>
<th>Budget</th>
<th>Client</th>
<th>Details</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody>
`;


orders.forEach(order=>{

const date=
new Date(order.created_at)
.toLocaleString();


html+=`

<tr>

<td>
${escapeHtml(date)}
</td>

<td>
<strong>
${escapeHtml(order.company_name||"-")}
</strong>
</td>

<td>
${escapeHtml(order.country||"-")}
</td>

<td>
${escapeHtml(order.business_type||"-")}
</td>

<td>
${escapeHtml(order.service||"-")}
</td>

<td>
${escapeHtml(order.budget||"-")}
</td>

<td>
${escapeHtml(order.client_name||"-")}
<br>
${escapeHtml(order.client_email||"")}
<br>
${escapeHtml(order.client_phone||"")}
</td>

<td class="details">
${escapeHtml(order.project_details||"-")}
</td>

<td>

<select
onchange="changeStatus('${order.id}',this.value)">

<option value="New"
${order.status==="New"?"selected":""}>
New
</option>

<option value="In Progress"
${order.status==="In Progress"?"selected":""}>
In Progress
</option>

<option value="Completed"
${order.status==="Completed"?"selected":""}>
Completed
</option>

<option value="Cancelled"
${order.status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>

</td>

<td>

<button
class="delete"
onclick="deleteOrder('${order.id}')">

Delete

</button>

</td>

</tr>
`;

});


html+=`

</tbody>
</table>
`;

box.innerHTML=html;

}


/* =================================
   CHANGE STATUS
================================= */

async function changeStatus(id,status){

const {error} =
await supabaseClient
.from("client_orders")
.update({status:status})
.eq("id",id);

if(error){

alert("Update failed: "+error.message);

return;
}

await loadOrders();

}


/* =================================
   DELETE
================================= */

async function deleteOrder(id){

if(!confirm(
"Are you sure you want to delete this order?"
)){

return;

}

const {error} =
await supabaseClient
.from("client_orders")
.delete()
.eq("id",id);

if(error){

alert("Delete failed: "+error.message);

return;
}

await loadOrders();

}


/* =================================
   SECURITY
================================= */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =================================
   START
================================= */

checkSession();

</script>

</body>
</html>
